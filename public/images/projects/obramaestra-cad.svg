    <text x="365" y="105" fill="#fef3c7" font-family="sans-serif" font-size="14" font-weight="bold">Cuantificación de Materiales</text>
    <rect x="365" y="125" width="250" height="1" fill="rgba(255,255,255,0.1)"/>
    <text x="365" y="155" fill="#ffffff" font-family="sans-serif" font-size="12">✓ Bloques de concreto por m²</text>
    <text x="365" y="185" fill="#ffffff" font-family="sans-serif" font-size="12">✓ Bultos de cemento, arena y grava</text>
    <text x="365" y="215" fill="#ffffff" font-family="sans-serif" font-size="12">✓ Cimientos corridos y losas armadas</text>
    <text x="365" y="245" fill="#ffffff" font-family="sans-serif" font-size="12">✓ Exportación de presupuesto editable</text>
    <rect x="365" y="280" width="250" height="35" rx="8" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b"/>
    <text x="490" y="302" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Ahorro de hasta 18% en Desperdicio</text>
