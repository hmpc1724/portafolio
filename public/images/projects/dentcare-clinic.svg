<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-dent" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow-dent" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>
  <rect width="800" height="500" rx="20" fill="url(#bg-dent)"/>
  <circle cx="240" cy="220" r="150" fill="#0d9488" opacity="0.3" filter="url(#glow-dent)"/>
  <circle cx="600" cy="300" r="130" fill="#06b6d4" opacity="0.2" filter="url(#glow-dent)"/>

  <g transform="translate(60, 50)">
    <rect width="680" height="400" rx="16" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5"/>
    <rect width="680" height="44" rx="16" fill="rgba(255, 255, 255, 0.06)"/>
    <circle cx="28" cy="22" r="5" fill="#ef4444"/>
    <circle cx="44" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="22" r="5" fill="#10b981"/>
    <text x="340" y="26" fill="rgba(255, 255, 255, 0.7)" font-family="sans-serif" font-size="11" text-anchor="middle">dentcare-sonora.mx/agendar-cita</text>

    <!-- Clinic Card -->
    <rect x="40" y="70" width="280" height="295" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(13, 148, 136, 0.4)"/>
    <circle cx="180" cy="170" r="60" fill="#0d9488" opacity="0.3"/>
    <text x="180" y="180" fill="#ccfbf1" font-family="sans-serif" font-size="42" text-anchor="middle">🦷</text>
    <text x="60" y="265" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Clínica Dental Avanzada</text>
    <text x="60" y="285" fill="#5eead4" font-family="sans-serif" font-size="11">Ortodoncia • Implantes • Blanqueamiento</text>
    <text x="60" y="325" fill="#2dd4bf" font-family="sans-serif" font-size="14" font-weight="bold">Agenda Médica Online 24/7</text>

    <!-- Features -->
    <rect x="340" y="70" width="300" height="295" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
    <text x="365" y="105" fill="#99f6e4" font-family="sans-serif" font-size="14" font-weight="bold">Gestión de Pacientes & Citas</text>
    <rect x="365" y="125" width="250" height="1" fill="rgba(255,255,255,0.1)"/>
    <text x="365" y="155" fill="#ffffff" font-family="sans-serif" font-size="12">✓ Selector interactivo de especialista</text>
    <text x="365" y="185" fill="#ffffff" font-family="sans-serif" font-size="12">✓ Recordatorios automáticos por WhatsApp</text>
    <text x="365" y="215" fill="#ffffff" font-family="sans-serif" font-size="12">✓ Casos de éxito con comparativas antes/después</text>
    <text x="365" y="245" fill="#ffffff" font-family="sans-serif" font-size="12">✓ Posicionamiento local SEO en Google Maps</text>
    <rect x="365" y="280" width="250" height="35" rx="8" fill="rgba(13, 148, 136, 0.2)" stroke="#0d9488"/>
    <text x="490" y="302" fill="#2dd4bf" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Alta Conversión de Nuevos Pacientes</text>
