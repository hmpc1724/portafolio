<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#06b6d4" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="250" r="180" fill="#06b6d4" opacity="0.12" filter="blur(40px)"/>
  
  <!-- Left card (Cover flow) -->
  <g transform="translate(140, 100) rotate(8) scale(0.8)" opacity="0.65">
    <rect width="200" height="320" rx="24" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
    <rect x="20" y="240" width="160" height="60" rx="14" fill="#ffffff" fill-opacity="0.08"/>
  </g>

  <!-- Right card (Cover flow) -->
  <g transform="translate(500, 100) rotate(-8) scale(0.8)" opacity="0.65">
    <rect width="200" height="320" rx="24" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
    <rect x="20" y="240" width="160" height="60" rx="14" fill="#ffffff" fill-opacity="0.08"/>
  </g>

  <!-- Center Card Hero -->
  <g transform="translate(290, 60)" filter="url(#shadow)">
    <rect width="220" height="360" rx="28" fill="#0b1120" stroke="url(#glow)" stroke-width="3"/>
    
    <!-- Top badge -->
    <rect x="20" y="20" width="90" height="26" rx="13" fill="#000000" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.2"/>
    <circle cx="34" cy="33" r="7" fill="#ec4899"/>
    <text x="48" y="37" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">@reels</text>

    <!-- Play Icon Center -->
    <circle cx="110" cy="170" r="28" fill="#06b6d4" fill-opacity="0.9"/>
    <polygon points="104,158 122,170 104,182" fill="#090d16"/>

    <!-- Bottom Product Bar Liquid Glass -->
    <rect x="15" y="280" width="190" height="65" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.25"/>
    <rect x="25" y="290" width="45" height="45" rx="12" fill="#06b6d4" fill-opacity="0.3"/>
    <text x="80" y="308" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Top Ribbed</text>
    <text x="80" y="325" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="900">$549 MXN</text>
    <circle cx="180" cy="312" r="14" fill="#06b6d4"/>
    <text x="175" y="316" fill="#090d16" font-family="sans-serif" font-size="12" font-weight="bold">🛒</text>
  </g>

  <text x="400" y="470" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Shoppable UGC Video Slider • EmbedSocial Coverflow 3D</text>
</svg>
