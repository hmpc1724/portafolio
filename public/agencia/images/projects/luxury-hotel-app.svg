<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-hotel" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow-hotel" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>
  <rect width="800" height="500" rx="20" fill="url(#bg-hotel)"/>
  <circle cx="240" cy="220" r="150" fill="#818cf8" opacity="0.3" filter="url(#glow-hotel)"/>
  <circle cx="600" cy="300" r="130" fill="#ec4899" opacity="0.2" filter="url(#glow-hotel)"/>

  <g transform="translate(60, 50)">
    <rect width="680" height="400" rx="16" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5"/>
    <rect width="680" height="44" rx="16" fill="rgba(255, 255, 255, 0.06)"/>
    <circle cx="28" cy="22" r="5" fill="#ef4444"/>
    <circle cx="44" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="22" r="5" fill="#10b981"/>
    <text x="340" y="26" fill="rgba(255, 255, 255, 0.7)" font-family="sans-serif" font-size="11" text-anchor="middle">resort-sancarlos.app/guest-experience</text>

    <!-- Mobile Screen View -->
    <rect x="40" y="70" width="280" height="295" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(129, 140, 248, 0.4)"/>
    <circle cx="180" cy="170" r="60" fill="#6366f1" opacity="0.3"/>
    <text x="180" y="180" fill="#e0e7ff" font-family="sans-serif" font-size="38" text-anchor="middle">🛎️</text>
    <text x="60" y="265" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Luxury Guest App PWA</text>
    <text x="60" y="285" fill="#c7d2fe" font-family="sans-serif" font-size="11">Hoteles Boutique & Condos San Carlos</text>
    <text x="60" y="325" fill="#818cf8" font-family="sans-serif" font-size="14" font-weight="bold">Llave Digital NFC + Domótica</text>

    <!-- Amenities Panel -->
    <rect x="340" y="70" width="300" height="295" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
    <text x="365" y="105" fill="#e0e7ff" font-family="sans-serif" font-size="14" font-weight="bold">Control en Mano del Huésped</text>
    <rect x="365" y="125" width="250" height="1" fill="rgba(255,255,255,0.1)"/>
    <text x="365" y="155" fill="#ffffff" font-family="sans-serif" font-size="12">✓ Apertura de puerta con llave digital NFC</text>
    <text x="365" y="185" fill="#ffffff" font-family="sans-serif" font-size="12">✓ Control de aire acondicionado HVAC (18° - 26°C)</text>
    <text x="365" y="215" fill="#ffffff" font-family="sans-serif" font-size="12">✓ Menú de Room Service y pedidos con rastreador</text>
    <text x="365" y="245" fill="#ffffff" font-family="sans-serif" font-size="12">✓ Reserva de yates y tours en San Carlos</text>
    <rect x="365" y="280" width="250" height="35" rx="8" fill="rgba(99, 102, 241, 0.2)" stroke="#6366f1"/>
    <text x="490" y="302" fill="#a5b4fc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Experiencia 5 Estrellas Sin Fricción</text>
