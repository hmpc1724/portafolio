<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-clean" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow-clean" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>
  <rect width="800" height="500" rx="20" fill="url(#bg-clean)"/>
  <circle cx="240" cy="220" r="150" fill="#0284c7" opacity="0.3" filter="url(#glow-clean)"/>
  <circle cx="600" cy="300" r="130" fill="#10b981" opacity="0.2" filter="url(#glow-clean)"/>

  <g transform="translate(60, 50)">
    <rect width="680" height="400" rx="16" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5"/>
    <rect width="680" height="44" rx="16" fill="rgba(255, 255, 255, 0.06)"/>
    <circle cx="28" cy="22" r="5" fill="#ef4444"/>
    <circle cx="44" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="22" r="5" fill="#10b981"/>
    <text x="340" y="26" fill="rgba(255, 255, 255, 0.7)" font-family="sans-serif" font-size="11" text-anchor="middle">limpiapro.mx/cotizador-instantaneo</text>

    <!-- Service Card -->
    <rect x="40" y="70" width="280" height="295" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(2, 132, 199, 0.4)"/>
    <circle cx="180" cy="170" r="60" fill="#0284c7" opacity="0.3"/>
    <text x="180" y="180" fill="#e0f2fe" font-family="sans-serif" font-size="38" text-anchor="middle">✨</text>
    <text x="60" y="265" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">LimpiaPro Profesional</text>
    <text x="60" y="285" fill="#bae6fd" font-family="sans-serif" font-size="11">Casas • Oficinas • Post-Construcción</text>
    <text x="60" y="325" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">Cotizador en 3 Pasos</text>

    <!-- Details -->
    <rect x="340" y="70" width="300" height="295" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
    <text x="365" y="105" fill="#bae6fd" font-family="sans-serif" font-size="14" font-weight="bold">Automatización de Presupuestos</text>
    <rect x="365" y="125" width="250" height="1" fill="rgba(255,255,255,0.1)"/>
    <text x="365" y="155" fill="#ffffff" font-family="sans-serif" font-size="12">✓ Estimación automática por metros cuadrados</text>
    <text x="365" y="185" fill="#ffffff" font-family="sans-serif" font-size="12">✓ Extras opcionales: desinfección UV y alfombras</text>
    <text x="365" y="215" fill="#ffffff" font-family="sans-serif" font-size="12">✓ Selector de fecha, hora y confirmación inmediata</text>
    <text x="365" y="245" fill="#ffffff" font-family="sans-serif" font-size="12">✓ Integración con WhatsApp para equipo operativo</text>
    <rect x="365" y="280" width="250" height="35" rx="8" fill="rgba(2, 132, 199, 0.2)" stroke="#0284c7"/>
    <text x="490" y="302" fill="#7dd3fc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">100% Cotizaciones Cerradas por WhatsApp</text>
